<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog</title>
    <style>

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #FFF0F5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            background-color:#4B0082; 
            border: 3px solid #EE82EE; 
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: bold;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        .post {
            color: #1a202c;
            line-height: 1.6;
        }

        .post h2 {
            color: #1a365d;
            font-size: 2rem;
            margin: 0 0 15px 0;
        }

        .post .author {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .post .content {
            font-size: 1.1rem;
            color: #2d3748;
        }

        img {
             width: 220px;
             height: 220px;
        }

        .area-interacao {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .botao-retangulo {
            background-color: #ffffff;
            border: 2px solid #4B0082;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 0px; /* Totalmente retangular como na aula */
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

    </style>

</head>
<body>

    <div class="container">

        <header>
            <h1>Blog da Flor</h1>
            <p>Vamos compartilhar conhecimentos de beleza</p>
        </header>


        <article class="post">
            <img src="imgmoda1.png" alt="logotipo de maquiagem e moda: um livro aberto de onde emerge maquiagens e coisas fashions brilhante, cercado por pinceis, paletas, revistas. Cores em tons de rosa e branco.">
            <h3>Meu primeiro post</h3>
            <div class="author">Por: Maria Flor</div>
            <p class="content">
                Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de maquiagem e moda.
            </p>

            <article class="post">
    <img src="closetmake.png" alt="Uma penteadeira de luxo superiluminada estilo camarim, exibindo uma coleção de maquiagens diversas impecavelmente organizadas em suportes de acrílico sobre uma bancada de mármore..">
    <h3>Título do Seu Segundo Post</h3>
    <div class="author">Por: Maria Flor</div>
    <p class="content">
        Escreva aqui o texto ou a dica do seu segundo post do blog.
    </p>
</article>

            <div class="area-interacao">
                <button id="btn-coracao" class="botao-retangulo" alt="Botao de Coracao" onclick="clicouCoracao()">
                    ❤️ <span id="qtd-coracao">0</span>
                </button>
                
                <button id="btn-like" class="botao-retangulo" alt="Botao de Like" onclick="clicouLike()">
                    👍 <span id="qtd-like">0</span>
                </button>
            </div>
        </article>
    </div>

    <script>
        let coracaoAtivo = false;
        let likeAtivo = false;

        let totalCoracoes = 0;
        let totalLikes = 0;

        let textoCoracao = document.getElementById("qtd-coracao");
        let textoLike = document.getElementById("qtd-like");
        
        let botaoCoracao = document.getElementById("btn-coracao");
        let botaoLike = document.getElementById("btn-like");

        function clicouCoracao() {
            if (coracaoAtivo == false) {
                totalCoracoes = totalCoracoes + 1;
                textoCoracao.textContent = totalCoracoes;
                botaoCoracao.style.backgroundColor = "#E6E6FA"; // Fundo colorido
                coracaoAtivo = true;
            } else {
                totalCoracoes = totalCoracoes - 1;
                textoCoracao.textContent = totalCoracoes;
                botaoCoracao.style.backgroundColor = "#ffffff"; 
                coracaoAtivo = false;
            }
        }

        function clicouLike() {
            if (likeAtivo == false) {
                totalLikes = totalLikes + 1;
                textoLike.textContent = totalLikes;
                botaoLike.style.backgroundColor = "#E6E6FA"; // Fundo colorido
                likeAtivo = true;
            } else {
                totalLikes = totalLikes - 1;
                textoLike.textContent = totalLikes;
                botaoLike.style.backgroundColor = "#ffffff"; 
                likeAtivo = false;
            }
        }
    </script>

</body>
</html>

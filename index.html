<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog</title>
    <style>

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #FFC0CB;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            background-color:#4B0082; 
            border: 3px solid #EE82EE; 
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: bold;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        .post {
            color: #1a202c;
            line-height: 1.6;
        }

        .post h2 {
            color: #1a365d;
            font-size: 2rem;
            margin: 0 0 15px 0;
        }

        .post .author {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .post .content {
            font-size: 1.1rem;
            color: #2d3748;
        }

        img {
             width: 220px;
             height: 220px;
        }

  
        .botao-curtir {
            background-color: white;
            border: 2px solid #4B0082;
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }

    </style>

</head>
<body>

    <div class="container">

        <header>
            <h1>Meu blog</h1>
            <p>Vou compartilhar conhecimentos sobre maquiagens</p>
            <h1>Blog da Flor</h1>
            <p>Vamos compartilhar conhecimentos de beleza</p>
        </header>


        <article class="post">
            <img src="imgmoda1.png" alt="logotipo de maquiagem e moda: um livro aberto de onde emerge maquiagens e coisas fashions brilhante, cercado por pinceis, paletas, revistas. Cores em tons de rosa e branco.">
            <h2>Meu primeiro post</h2>
            <div class="author">Por: Maria Flor</div>
            <p class="content">
                Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de maquiagem e moda.
            </p>

            
            <button id="botao-reacao" class="botao-curtir" onclick="reagirPost()">🤍 Curtir (0)</button>
        </article>
    </div>

    <script>

        let estaCurtido = false;
        
        // Buscamos o botão pelo ID
        let botaoReacao = document.getElementById("botao-reacao");

        function reagirPost() {
            if (estaCurtido == false) {
               
                botaoReacao.textContent = "👍 Curtido (1)";
                botaoReacao.style.backgroundColor = "#EE82EE";
                botaoReacao.style.color = "white";
                estaCurtido = true;
            } else {
                
                botaoReacao.textContent = "🤍 Curtir (0)";
                botaoReacao.style.backgroundColor = "white";
                botaoReacao.style.color = "black";
                estaCurtido = false;
            }
        }
    </script>

</body>
</html>
